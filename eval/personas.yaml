# Eleven personas, five of them paired, plus four controls -> 20 query instances.
#
# DEV / SEALED SPLIT, pre-registered 2026-09-27. 13 dev, 7 sealed.
#
# AMENDED the same day, before any retrieval ran, to add `p11_barnevernspedagog`
# to the sealed set: D16 recorded that sealed had no "Norwegian genuinely
# required, return few results" case and that the fix had to be a NEW persona
# written before results existed, never a reassignment afterwards. Sealed
# therefore moved 6 -> 7. That is an amendment to a pre-registered quantity and
# it is recorded as one in DECISIONS.md D17, not folded in silently. The git
# timestamp on this commit is the pre-registration; see DECISIONS.md D16 for the
# reasoning and PLAN.md E1. The rule, from STANDARDS.md: sealed personas are
# opened ONCE, at the end. No sealed persona may be inspected, tuned against, or
# used to choose a hyperparameter, and `tests/unit/test_persona_split.py` asserts
# the structure so the split cannot drift silently.
#
# Sealed verticals are DISJOINT from dev verticals, deliberately. That makes the
# sealed run a test of generalisation to unseen verticals rather than a rerun of
# dev, and it means the sealed number should be read as a LOWER bound on dev
# performance, not as a like-for-like replicate.
#
# Written first-person, as someone would actually type into a job search. Paired
# variants differ ONLY in the language sentence, linked by `pair_id` — that is
# what makes the negation stress-test a controlled comparison rather than two
# unrelated queries.
#
# FROZEN before any measurement. Changing a query after seeing results would make
# the comparison meaningless; record a problem in `notes` and change it afterwards
# in git.

personas:
  # ── paired: the five that carry the argument ──────────────────────────────
  - id: p1_sykepleier_norsk
    split: dev
    pair_id: p1
    vertical: Healthcare
    why: >
      The `norsk autorisasjon` precision trap. Norwegian professional
      authorisation is a LICENSING requirement, not a language one — an extractor
      that conflates them fails this persona in the direction nobody notices.
    query: >
      Jeg er sykepleier med erfaring fra sykehus og sykehjem. Jeg snakker
      flytende norsk. Jeg ser etter fast stilling, gjerne dagvakt.

  - id: p1_sykepleier_no_norsk
    split: dev
    pair_id: p1
    vertical: Healthcare
    query: >
      I am a nurse with hospital and nursing-home experience. I do not speak
      Norwegian. I am looking for a permanent position, preferably day shifts.

  - id: p2_tomrer_norsk
    split: dev
    pair_id: p2
    vertical: Trades
    why: >
      A low-English vertical, and 787 corpus ads. Håndverkere had ONE golden ad
      before the sealed set was built, so accuracy here was essentially unmeasured.
    query: >
      Jeg er tømrer med fagbrev og ti års erfaring med både nybygg og
      rehabilitering. Jeg snakker norsk. Jeg har førerkort klasse B.

  - id: p2_tomrer_no_norsk
    split: dev
    pair_id: p2
    vertical: Trades
    query: >
      I am a carpenter with a trade certificate and ten years of experience in
      both new builds and renovation. I do not speak Norwegian. I hold a category
      B driving licence.

  - id: p3_kokk_norsk
    split: sealed
    pair_id: p3
    vertical: Hospitality
    why: >
      Genuinely English-friendly in practice, so a system that hides everything
      when Norwegian is absent is visibly wrong here rather than arguably wrong.
    query: >
      Jeg er kokk med erfaring fra à la carte og storkjøkken. Jeg snakker norsk
      og engelsk. Jeg kan jobbe kveld og helg.

  - id: p3_kokk_no_norsk
    split: sealed
    pair_id: p3
    vertical: Hospitality
    query: >
      I am a chef with à la carte and large-scale kitchen experience. I do not
      speak Norwegian but I speak fluent English. I can work evenings and weekends.

  - id: p4_backend_norsk
    split: dev
    pair_id: p4
    vertical: Software
    why: The English-friendliest vertical; the easiest case the baseline should win.
    query: >
      Jeg er backend-utvikler med Python, PostgreSQL og Kubernetes. Jeg snakker
      norsk. Jeg ser etter fast stilling i Oslo eller hybrid.

  - id: p4_backend_no_norsk
    split: dev
    pair_id: p4
    vertical: Software
    query: >
      I am a backend developer working with Python, PostgreSQL and Kubernetes.
      I do not speak Norwegian. I am looking for a permanent role in Oslo or hybrid.

  - id: p5_data_scientist_norsk
    split: dev
    pair_id: p5
    vertical: Data
    why: >
      THE ORIGINATING BUG. This is the query that returned Norwegian-requiring ads
      after the seeker stated they do not speak Norwegian. IT had ZERO golden ads
      before the sealed set, which is why this persona's accuracy was unmeasured.
    query: >
      Jeg er data scientist med erfaring innen maskinlæring, Python og SQL. Jeg
      snakker norsk. Jeg ser etter stilling innen AI eller analyse.

  - id: p5_data_scientist_no_norsk
    split: dev
    pair_id: p5
    vertical: Data
    query: >
      I am a data scientist with experience in machine learning, Python and SQL.
      I do not speak Norwegian. I am looking for a role in AI or analytics.

  # ── unpaired ──────────────────────────────────────────────────────────────
  - id: p6_grunnskolelaerer
    split: dev
    vertical: Education
    expect_few_results: true
    why: >
      A DESIGNED NEGATIVE CONTROL, and it must not be dropped when it scores
      badly. Norwegian genuinely IS required to teach in a Norwegian primary
      school. A good system returns few results and says so; a system that
      manufactures matches here is worse than one that returns nothing.
    query: >
      I am a qualified primary school teacher. I do not speak Norwegian. I would
      like to teach in Norway.

  - id: p7_lagermedarbeider
    split: dev
    vertical: Logistics
    why: Low-text-volume ads — tests behaviour when there is little to extract from.
    query: >
      I am looking for warehouse work. I have a forklift certificate. I do not
      speak Norwegian yet but I am learning.

  - id: p8_regnskapsforer
    split: sealed
    vertical: Finance
    why: >
      Norwegian-regulation-bound, so it tests the authorisation-versus-language
      distinction a second time in a different vertical.
    query: >
      I am an accountant with experience in Norwegian GAAP and payroll. I do not
      speak Norwegian. I am looking for a permanent position.

  - id: p9_multilingual_support
    split: sealed
    vertical: Customer service
    why: >
      The one persona where NOT speaking Norwegian is an ASSET. A system that only
      ever penalises the absence of Norwegian will get this backwards.
    query: >
      I speak Polish, English and Lithuanian fluently. I do not speak Norwegian.
      I am looking for customer service or support work.

  - id: p10_civil_engineer
    split: sealed
    vertical: Engineering
    why: Large-employer bilingual-ad regime — many ads are half Norwegian, half English.
    query: >
      I am a civil engineer with experience in structural design and Eurocode.
      I do not speak Norwegian. I am open to roles anywhere in Norway.

  - id: p11_barnevernspedagog
    split: sealed
    vertical: Social services
    expect_few_results: true
    why: >
      THE DESIGNED NEGATIVE CONTROL, HELD OUT. Norwegian is genuinely required
      for statutory child-welfare work — client contact, case documentation and
      court reporting are all in Norwegian, and no amount of goodwill makes an
      English-only caseworker lawful. The corpus agrees: 308 ads in this vertical,
      219 of them explicitly demanding Norwegian, and ZERO the census calls
      accessible.

      So the correct behaviour is to return few results or none, AND SAY SO. A
      system that manufactures matches here is worse than one that returns
      nothing, because it wastes the seeker's applications on jobs they cannot
      hold. `expect_few_results: true` marks that.

      Sealed rather than dev because p6 already carries this property in dev,
      where the "and say so" wording gets calibrated. This one asks whether that
      calibration GENERALISES to a vertical never developed against — which is
      the only version of the question a dev persona cannot answer.
    query: >
      I am a qualified social worker with experience in child welfare and family
      support. I do not speak Norwegian. I am looking for a permanent position.

  # ── controls: NO language constraint stated ───────────────────────────────
  #
  # ADDED AFTER THE CENSUS, and the census is why. Every one of the 15 personas
  # above states a language constraint, so nothing measured the ordinary case:
  # a seeker who never mentions language at all. That is most seekers.
  #
  # The risk is concrete. The census puts 3,507 ads — 34.5% of the corpus — in
  # the blocking set by SILENCE alone, not by any stated requirement. If the
  # constraint stage fires unconditionally, every seeker sees 9.4% of the
  # corpus, the product is destroyed for the ~90% who speak Norwegian, and the
  # language metric looks excellent throughout.
  #
  # So these four exist to assert a NON-effect: for a query with no language
  # sentence, the ranking must be identical to the same pipeline with the
  # constraint stage switched off. `expect_language_constraint: false` is what
  # tests/unit/test_constraints_only_when_stated.py keys on.
  #
  # They also exercise the facets the evaluation otherwise ignores. The census
  # extracts 15; the personas above test one.

  - id: c1_lager_no_language_mention
    split: dev
    vertical: Logistics
    control: true
    expect_language_constraint: false
    exercises: [location, extent, drivers_license]
    why: >
      The plain case, and the majority one. Nothing about language, so the
      language stage must contribute exactly nothing. Also the lowest-text-volume
      ad regime, where a constraint stage has the least to work with.
    query: >
      Jeg søker jobb på lager i Bergen. Jeg har truckførerbevis og førerkort
      klasse B. Jeg kan jobbe skift.

  - id: c2_sykepleier_authorisation_only
    split: dev
    vertical: Healthcare
    control: true
    expect_language_constraint: false
    exercises: [authorisation, location, extent]
    why: >
      AUTHORISATION IN ISOLATION. `authorisation_required` has its own constraint
      and its own badge precisely so a LICENSING rule is never mistaken for a
      language rule — and no persona tested it alone. This one states a licence
      and says nothing about language, so any language penalty applied here is
      the exact confusion the separation exists to prevent.
    query: >
      Jeg er sykepleier med norsk autorisasjon og HPR-nummer. Jeg ser etter
      fast stilling i Trondheim, gjerne dagvakt.

  - id: c3_utvikler_remote_seniority
    split: sealed
    vertical: Technology
    control: true
    expect_language_constraint: false
    exercises: [remote, seniority, skills]
    why: >
      Seniority and remote, with no language sentence. IT is the corpus's
      thinnest vertical (240 ads) and its most English-friendly, so a language
      stage that leaks would show up here first.
    query: >
      Jeg er senior backend-utvikler med åtte års erfaring i Python og
      Kubernetes. Jeg ønsker å jobbe hjemmefra eller hybrid.

  - id: c4_laerer_norsk_speaker
    split: dev
    vertical: Education
    control: true
    expect_language_constraint: false
    exercises: [location, contract]
    why: >
      A FLUENT Norwegian speaker who does not think to mention it, which is how
      a Norwegian speaker actually writes. Distinct from p6, who states the
      absence. If silence is read as a constraint, this persona is punished for
      saying nothing.
    query: >
      Jeg er grunnskolelærer med undervisningskompetanse i norsk og matematikk.
      Jeg søker fast stilling i Oslo-området fra høsten.
