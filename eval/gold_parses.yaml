# Gold parses — the seeker side, set S. Schema and reasoning: GOLD_PARSE_SCHEMA.md
#
# Hand-authored BEFORE any retrieval ran. Every `evidence` value is a verbatim
# substring of that persona's frozen `query` in personas.yaml, checked
# character-for-character by tests/unit/test_gold_parse.py. If the seeker did not
# say it, it is not here — an oracle written in the corpus's vocabulary instead of
# the seeker's would delete the vocabulary mismatch LIMITATIONS §14 measured and
# flatter retrieval by construction.
#
# ABSENCE MEANS NOT STATED. A facet with no row is a distinct state from every
# stated value. For language that becomes `language_constraint=None` and severity
# of exactly 0.0 — 3,507 ads hang on it.
#
# STATUS: all 13 DEV personas are parsed. The 7 SEALED personas are a separate
# pass — authoring their parses reads only frozen query text and does not touch
# the seal, but it is kept separate so the dev oracle can be run first.
#
# The first three below were written to stress the schema rather than to be easy:
# a paired negation variant, the `norsk autorisasjon` control, and the sealed
# negative control.

gold_parses:

  # ── a paired negation variant: the case the project started from ───────────
  - persona_id: p1_sykepleier_no_norsk
    constraints:
      - facet: occupation
        value: nurse
        priority: hard
        evidence: "I am a nurse"
      - facet: skill
        value: hospital and nursing-home experience
        priority: soft
        evidence: "hospital and nursing-home experience"
      # The whole point of the project, and note what it is NOT: it is not a
      # negation. It is the capability level the seeker HAS.
      - facet: language.norwegian
        value: none
        priority: hard
        evidence: "I do not speak Norwegian"
      - facet: contract.permanence
        value: permanent
        priority: soft
        evidence: "a permanent position"
      # STATED AND UNSCOREABLE. Nothing in the corpus records shift, so a
      # perfect parser and a perfect encoder still cannot honour this. The facet
      # maps to None, which `coverage()` counts instead of silently dropping.
      - facet: contract.shift
        value: day
        priority: soft
        evidence: "preferably day shifts"

  # ── a control: the `norsk autorisasjon` trap, and NO language constraint ───
  #
  # This parse is the one most likely to be authored wrongly, which is why it is
  # here. The query contains the word `norsk` — inside `norsk autorisasjon`, a
  # LICENSING credential. A parse that records `language.norwegian` from it turns
  # a control persona into a constrained one, and the non-effect the four controls
  # exist to protect is gone. `check_against_personas` raises on exactly that.
  - persona_id: c2_sykepleier_authorisation_only
    constraints:
      - facet: occupation
        value: sykepleier
        priority: hard
        evidence: "Jeg er sykepleier"
      - facet: credential.authorisation
        value: norsk autorisasjon
        priority: hard
        evidence: "norsk autorisasjon"
      - facet: credential.authorisation
        value: HPR-nummer
        priority: hard
        evidence: "HPR-nummer"
      - facet: location.place
        value: Trondheim
        priority: hard
        evidence: "i Trondheim"
      - facet: contract.permanence
        value: permanent
        priority: soft
        evidence: "fast stilling"
      - facet: contract.shift
        value: day
        priority: soft
        evidence: "gjerne dagvakt"
      # NO language.* row. Deliberate and load-bearing: this seeker said nothing
      # about language, so the language stage must contribute exactly nothing.

  # ── the sealed negative control: Norwegian genuinely required (D17) ────────
  - persona_id: p11_barnevernspedagog
    constraints:
      - facet: occupation
        value: social worker
        priority: hard
        evidence: "I am a qualified social worker"
      - facet: skill
        value: child welfare and family support
        priority: soft
        evidence: "experience in child welfare and family support"
      - facet: language.norwegian
        value: none
        priority: hard
        evidence: "I do not speak Norwegian"
      - facet: contract.permanence
        value: permanent
        priority: soft
        evidence: "a permanent position"

# ════════════════════════════════════════════════════════════════════════════
# THE REMAINING DEV PERSONAS. Sealed parses are a separate pass.
#
# ONE CONVENTION, RECORDED BECAUSE IT IS A JUDGMENT AND IT MOVES A NUMBER.
# `Jeg snakker flytende norsk` is explicit and maps to `fluent`. An unqualified
# `Jeg snakker norsk` does not state a level, and it is read as `fluent` here on
# two grounds: an unqualified claim to speak a language is ordinarily a claim to
# use it at work, and the query itself is written in idiomatic Norwegian, which
# is corroborating evidence the seeker produced. This matters — SPEAKER_DISCOUNT
# is 0.0 for `fluent` against 0.6 for `conversational`, so reading these as
# conversational would let ads penalise a Norwegian speaker. Recorded so a
# reviewer can disagree with the convention in one place rather than in six.
# ════════════════════════════════════════════════════════════════════════════

  - persona_id: p1_sykepleier_norsk
    constraints:
      - {facet: occupation, value: sykepleier, priority: hard,
         evidence: "Jeg er sykepleier"}
      - {facet: skill, value: erfaring fra sykehus og sykehjem, priority: soft,
         evidence: "erfaring fra sykehus og sykehjem"}
      - {facet: language.norwegian, value: fluent, priority: hard,
         evidence: "Jeg snakker flytende norsk"}
      - {facet: contract.permanence, value: permanent, priority: soft,
         evidence: "fast stilling"}
      - {facet: contract.shift, value: day, priority: soft,
         evidence: "gjerne dagvakt"}

  - persona_id: p2_tomrer_norsk
    constraints:
      - {facet: occupation, value: tømrer, priority: hard,
         evidence: "Jeg er tømrer"}
      - {facet: credential.trade_certificate, value: fagbrev, priority: hard,
         evidence: "fagbrev"}
      - {facet: experience.years, value: 10, priority: soft,
         evidence: "ti års erfaring"}
      - {facet: skill, value: nybygg og rehabilitering, priority: soft,
         evidence: "nybygg og rehabilitering"}
      - {facet: language.norwegian, value: fluent, priority: hard,
         evidence: "Jeg snakker norsk"}
      - {facet: credential.licence, value: førerkort klasse B, priority: hard,
         evidence: "førerkort klasse B"}

  - persona_id: p2_tomrer_no_norsk
    constraints:
      - {facet: occupation, value: carpenter, priority: hard,
         evidence: "I am a carpenter"}
      - {facet: credential.trade_certificate, value: trade certificate,
         priority: hard, evidence: "a trade certificate"}
      - {facet: experience.years, value: 10, priority: soft,
         evidence: "ten years of experience"}
      - {facet: skill, value: new builds and renovation, priority: soft,
         evidence: "new builds and renovation"}
      - {facet: language.norwegian, value: none, priority: hard,
         evidence: "I do not speak Norwegian"}
      - {facet: credential.licence, value: category B driving licence,
         priority: hard, evidence: "a category B driving licence"}

  - persona_id: p4_backend_norsk
    constraints:
      - {facet: occupation, value: backend-utvikler, priority: hard,
         evidence: "Jeg er backend-utvikler"}
      - {facet: skill, value: Python, priority: soft, evidence: "Python"}
      - {facet: skill, value: PostgreSQL, priority: soft, evidence: "PostgreSQL"}
      - {facet: skill, value: Kubernetes, priority: soft, evidence: "Kubernetes"}
      - {facet: language.norwegian, value: fluent, priority: hard,
         evidence: "Jeg snakker norsk"}
      - {facet: contract.permanence, value: permanent, priority: soft,
         evidence: "fast stilling"}
      - {facet: location.place, value: Oslo, priority: hard, evidence: "i Oslo"}
      # `eller hybrid` makes the Oslo requirement satisfiable remotely. Recorded
      # as a preference, not a requirement — the seeker offered it as one of two
      # acceptable options rather than demanding it.
      - {facet: work.remote, value: preferred, priority: soft,
         evidence: "hybrid"}

  - persona_id: p4_backend_no_norsk
    constraints:
      - {facet: occupation, value: backend developer, priority: hard,
         evidence: "I am a backend developer"}
      - {facet: skill, value: Python, priority: soft, evidence: "Python"}
      - {facet: skill, value: PostgreSQL, priority: soft, evidence: "PostgreSQL"}
      - {facet: skill, value: Kubernetes, priority: soft, evidence: "Kubernetes"}
      - {facet: language.norwegian, value: none, priority: hard,
         evidence: "I do not speak Norwegian"}
      - {facet: contract.permanence, value: permanent, priority: soft,
         evidence: "a permanent role"}
      - {facet: location.place, value: Oslo, priority: hard, evidence: "in Oslo"}
      - {facet: work.remote, value: preferred, priority: soft,
         evidence: "hybrid"}

  - persona_id: p5_data_scientist_norsk
    constraints:
      - {facet: occupation, value: data scientist, priority: hard,
         evidence: "Jeg er data scientist"}
      - {facet: skill, value: maskinlæring, priority: soft,
         evidence: "maskinlæring"}
      - {facet: skill, value: Python, priority: soft, evidence: "Python"}
      - {facet: skill, value: SQL, priority: soft, evidence: "SQL"}
      - {facet: language.norwegian, value: fluent, priority: hard,
         evidence: "Jeg snakker norsk"}
      - {facet: skill, value: AI eller analyse, priority: soft,
         evidence: "stilling innen AI eller analyse"}

  - persona_id: p5_data_scientist_no_norsk
    constraints:
      - {facet: occupation, value: data scientist, priority: hard,
         evidence: "I am a data scientist"}
      - {facet: skill, value: machine learning, priority: soft,
         evidence: "machine learning"}
      - {facet: skill, value: Python, priority: soft, evidence: "Python"}
      - {facet: skill, value: SQL, priority: soft, evidence: "SQL"}
      - {facet: language.norwegian, value: none, priority: hard,
         evidence: "I do not speak Norwegian"}
      - {facet: skill, value: AI or analytics, priority: soft,
         evidence: "a role in AI or analytics"}

  # The designed negative control. Norwegian genuinely IS required to teach in a
  # Norwegian primary school, so the right behaviour is few results and a reason.
  - persona_id: p6_grunnskolelaerer
    constraints:
      - {facet: occupation, value: primary school teacher, priority: hard,
         evidence: "I am a qualified primary school teacher"}
      - {facet: language.norwegian, value: none, priority: hard,
         evidence: "I do not speak Norwegian"}
      - {facet: location.anywhere, value: true, priority: soft,
         evidence: "teach in Norway"}

  - persona_id: p7_lagermedarbeider
    constraints:
      - {facet: occupation, value: warehouse work, priority: hard,
         evidence: "warehouse work"}
      - {facet: credential.licence, value: forklift certificate, priority: hard,
         evidence: "a forklift certificate"}
      # A SECOND JUDGMENT WORTH FLAGGING. "not ... yet but I am learning" is read
      # as `none`, not `basic`: the seeker states they do not speak it, and
      # learning is an intention rather than a present capability. The
      # conservative reading, and it costs them — SPEAKER_DISCOUNT is 1.0 for
      # `none` against 0.8 for `basic`, so `none` applies the FULL penalty. Read
      # as `basic` this persona would see slightly more. Unresolved by the text.
      - {facet: language.norwegian, value: none, priority: hard,
         evidence: "I do not speak Norwegian yet but I am learning"}

  # CONTROL. No language row, and that is the assertion.
  - persona_id: c1_lager_no_language_mention
    constraints:
      - {facet: occupation, value: lager, priority: hard,
         evidence: "jobb på lager"}
      - {facet: location.place, value: Bergen, priority: hard,
         evidence: "i Bergen"}
      - {facet: credential.licence, value: truckførerbevis, priority: hard,
         evidence: "truckførerbevis"}
      - {facet: credential.licence, value: førerkort klasse B, priority: hard,
         evidence: "førerkort klasse B"}
      - {facet: contract.shift, value: shift, priority: soft,
         evidence: "Jeg kan jobbe skift"}

  # CONTROL, and the `norsk`-as-SUBJECT-TAUGHT trap. `undervisningskompetanse i
  # norsk` is a teaching qualification in the Norwegian SUBJECT — a skill, not a
  # language claim. A parse that reads `language.norwegian` here punishes a
  # fluent Norwegian speaker for saying nothing about language, which is the
  # exact inversion c4 was written to catch.
  #
  # `fra høsten` — an availability date — has no facet in this schema and no
  # counterpart in the census, so it is not recorded. Noted rather than dropped
  # silently.
  - persona_id: c4_laerer_norsk_speaker
    constraints:
      - {facet: occupation, value: grunnskolelærer, priority: hard,
         evidence: "Jeg er grunnskolelærer"}
      - {facet: skill, value: undervisningskompetanse i norsk og matematikk,
         priority: soft,
         evidence: "undervisningskompetanse i norsk og matematikk"}
      - {facet: contract.permanence, value: permanent, priority: soft,
         evidence: "fast stilling"}
      - {facet: location.place, value: Oslo-området, priority: hard,
         evidence: "i Oslo-området"}
