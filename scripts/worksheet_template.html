<title>Sealed Set Labelling</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Light palette on bare :root. Cool institutional neutrals — the corpus is
     Norwegian public-sector — with one deep Nordic green for "decided".
     Three type roles, each doing a job: serif for text being JUDGED, sans for
     chrome being OPERATED, mono for the span that must be copied EXACTLY. */
  :root{
    --ink:#14181d; --paper:#f6f7f6; --card:#fff; --rule:#dadedb;
    --accent:#1c6a58; --accent-soft:#e6efeb; --warn:#9c4f28;
    --warn-soft:#f6ece6; --muted:#69727c; --hit:#fff9e3; --hit-edge:#e8d9a0; --on-accent:#ffffff;
    --serif:"Source Serif 4",Georgia,serif;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --ink:#e6e9e7; --paper:#14171a; --card:#1b1f22; --rule:#2e3438;
    --accent:#5fbfa4; --accent-soft:#1d2e29; --warn:#d98a5e;
    --warn-soft:#2d211a; --muted:#98a1a9; --hit:#2b2718; --hit-edge:#4d452a; --on-accent:#0e1412;
  }}
  :root[data-theme="dark"]{
    --ink:#e6e9e7; --paper:#14171a; --card:#1b1f22; --rule:#2e3438;
    --accent:#5fbfa4; --accent-soft:#1d2e29; --warn:#d98a5e;
    --warn-soft:#2d211a; --muted:#98a1a9; --hit:#2b2718; --hit-edge:#4d452a; --on-accent:#0e1412;
  }
  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{text-wrap:balance;margin:0}
  a{color:var(--accent)}

  header{position:sticky;top:0;z-index:20;background:var(--paper);
         border-bottom:1px solid var(--rule);padding:14px 20px}
  .hrow{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;
        max-width:1180px;margin:0 auto}
  h1{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em}
  .warnbar{font-size:12.5px;color:var(--warn);background:var(--warn-soft);
           border:1px solid var(--warn);border-radius:4px;padding:3px 9px}
  .prog{margin-left:auto;display:flex;gap:10px;align-items:center;
        font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
  .storenote{font-size:12px;color:var(--accent)}
  .storenote.warn{color:var(--warn)}
  .bar{width:150px;height:6px;background:var(--rule);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:0;
         transition:width .25s ease}

  .wrap{max-width:1180px;margin:0 auto;padding:20px;
        display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
  @media (max-width:880px){.wrap{grid-template-columns:1fr}}

  nav{position:sticky;top:76px;max-height:calc(100vh - 100px);overflow-y:auto;
      background:var(--card);border:1px solid var(--rule);border-radius:7px}
  nav ol{list-style:none;margin:0;padding:5px}
  nav li{margin:0}
  nav button{width:100%;text-align:left;background:none;border:0;color:var(--ink);
             font:inherit;font-size:12.5px;padding:6px 8px;border-radius:5px;
             cursor:pointer;display:flex;gap:7px;align-items:center}
  nav button:hover{background:var(--paper)}
  nav button[aria-current="true"]{background:var(--accent-soft);
             box-shadow:inset 2px 0 0 var(--accent)}
  .dot{width:7px;height:7px;border-radius:99px;background:var(--rule);flex:none}
  .dot.done{background:var(--accent)}
  nav .nm{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  nav .st{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .card{background:var(--card);border:1px solid var(--rule);border-radius:7px;
        padding:20px 22px;margin-bottom:16px}
  .strat{display:inline-block;font-family:var(--mono);font-size:11.5px;
         letter-spacing:.02em;color:var(--accent);background:var(--accent-soft);
         padding:2px 7px;border-radius:4px}
  .adtitle{font-family:var(--serif);font-size:22px;font-weight:600;
           margin:9px 0 6px;letter-spacing:-.01em}
  .why{font-size:12.5px;color:var(--muted);border-left:2px solid var(--rule);
       padding-left:10px;margin:10px 0 0}
  .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);
        margin-top:12px;padding-top:11px;border-top:1px solid var(--rule)}
  .meta b{color:var(--ink);font-weight:500}
  .trunc{color:var(--warn);font-weight:500}

  h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;
     color:var(--muted);font-weight:600;margin:0 0 9px}
  .hintline{font-size:12.5px;color:var(--muted);margin:-4px 0 11px}

  .blk{display:block;width:100%;text-align:left;font-family:var(--serif);
       font-size:15px;line-height:1.55;background:var(--paper);color:var(--ink);
       border:1px solid var(--rule);border-left:3px solid var(--rule);
       border-radius:5px;padding:9px 12px;margin-bottom:7px;cursor:pointer}
  .blk:hover{border-color:var(--accent);border-left-color:var(--accent)}
  .blk.hit{background:var(--hit);border-left-color:var(--hit-edge)}
  .blk.chosen{border-color:var(--accent);border-left-width:3px;
              border-left-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .blk small{display:block;font-family:var(--sans);font-size:11px;
             color:var(--muted);margin-top:4px}
  /* Literal gloss, not a fluent translation: må/bør/er en fordel and eller/og
     must survive intact because those distinctions ARE the label. */
  /* A line the real validator rejects: still shown, because it is context the
     labeller needs to judge the boundary, but never a valid span. */
  .blk.bad{opacity:.72;border-left-color:var(--warn)}
  .blk small.no{color:var(--warn)}
  .blk .gloss{display:block;font-family:var(--sans);font-size:13px;
             color:var(--muted);margin-top:6px;padding-top:6px;
             border-top:1px dashed var(--rule)}

  .levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:7px}
  .lv{display:flex;gap:9px;align-items:baseline;background:var(--paper);
      border:1px solid var(--rule);border-radius:5px;padding:8px 10px;
      cursor:pointer;font-size:13.5px;text-align:left;color:var(--ink);
      font-family:inherit}
  .lv:hover{border-color:var(--accent)}
  .lv[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);
      box-shadow:inset 0 0 0 1px var(--accent)}
  .lv kbd{font-family:var(--mono);font-size:10.5px;color:var(--muted);
      border:1px solid var(--rule);border-radius:3px;padding:0 4px;flex:none}
  .lv span{display:block}
  .lv em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}

  label.f{display:block;font-size:12px;text-transform:uppercase;
          letter-spacing:.06em;color:var(--muted);font-weight:600;margin:14px 0 5px}
  textarea,input,select{width:100%;font-family:var(--mono);font-size:13px;
          background:var(--paper);color:var(--ink);border:1px solid var(--rule);
          border-radius:5px;padding:8px 10px}
  textarea{min-height:58px;resize:vertical;line-height:1.45}
  select{font-family:var(--sans)}
  .spanok{font-size:12px;margin-top:5px;font-family:var(--mono)}
  .spanok.y{color:var(--accent)} .spanok.n{color:var(--warn)}
  .authsug{font-size:12.5px;color:var(--muted);margin-top:6px}
  .authbtn{display:block;width:100%;text-align:left;font-family:var(--mono);
     font-size:12.5px;margin-top:5px;padding:6px 9px;cursor:pointer;
     background:var(--paper);color:var(--ink);border:1px solid var(--rule);
     border-radius:5px}
  .authbtn:hover{border-color:var(--accent)}

  .navbtns{display:flex;gap:9px;margin-top:18px}
  button.act{font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;
       border-radius:5px;padding:8px 15px;border:1px solid var(--rule);
       background:var(--card);color:var(--ink)}
  /* Primary button text is a TOKEN, not a literal: a hardcoded #fff is
     unreadable on the light-mode accent's dark-mode counterpart. The previous
     version comma-joined a selector to an @media block, which is invalid CSS and
     silently dropped the whole rule. */
  button.act.primary{background:var(--accent);border-color:var(--accent);
       color:var(--on-accent)}
  button.act:hover{border-color:var(--accent)}

  .pf{font-size:12.5px;background:var(--warn-soft);border:1px solid var(--warn);
      border-radius:5px;padding:9px 11px;margin-bottom:12px}
  .pf b{color:var(--warn)}
  .pf code{font-family:var(--mono);font-size:12px}

  #out{font-family:var(--mono);font-size:11.5px;min-height:150px}
  .kbd-help{font-size:12px;color:var(--muted);margin-top:8px}
  .kbd-help kbd{font-family:var(--mono);border:1px solid var(--rule);
      border-radius:3px;padding:0 4px}
</style>

<header>
  <div class="hrow">
    <h1>Sealed set — labelling</h1>
    <span class="warnbar">HELD OUT · never tune the prompt against these</span>
    <div class="prog">
      <span id="storenote" class="storenote">checking storage…</span>
      <span id="ptext">0 / 0</span>
      <span class="bar"><i id="pbar"></i></span>
    </div>
  </div>
</header>

<div class="wrap">
  <nav><ol id="list"></ol></nav>
  <main id="main"></main>
</div>

<script>
const DATA = /*__DATA__*/null;
// v2: starting from scratch deliberately. A stale v1 payload would resurrect
// abandoned labels the moment the page opened.
const KEY = "sealed-labels-v2";
let labels = {}, cur = 0, DB = null, synced = false;
try { labels = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { labels = {}; }

const saveLocal = () => {
  try { localStorage.setItem(KEY, JSON.stringify(labels)); } catch (e) {}
};

// One document per ad. The contract asks for one write at a time per doc and
// only on change; a single blob would rewrite all 28 labels on every keystroke.
const saveRemote = n => {
  if (!DB) return;                      // no grant, or this view cannot run it
  const r = labels[n] || {};
  DB.doc(`labels/${n}`).set({
    n, level: r.level || null, span: r.span || "", worklang: r.worklang || "",
    auth: r.auth || "", note: r.note || "", at: new Date().toISOString()
  }).catch(() => {});                   // a refused write must not break typing
};

// Coalesce bursts: one write per ad per 600ms of quiet, never one per keystroke.
const pending = {};
const save = n => {
  // Stamp the local edit. Without this, `mine.at` was always undefined, the
  // merge rule's `!mine.at` was always true, and an incoming snapshot ALWAYS
  // won — so a fresh edit could silently revert to the stored row inside the
  // 600ms debounce window. Correcting a field and watching it undo itself is
  // the most confusing failure this page could have.
  if (n != null && labels[n]) labels[n].at = new Date().toISOString();
  saveLocal();
  if (n == null || !DB) return;
  clearTimeout(pending[n]);
  pending[n] = setTimeout(() => saveRemote(n), 600);
};

function setStatus(txt, warn) {
  const el = document.getElementById("storenote");
  if (el) { el.textContent = txt; el.className = "storenote" + (warn ? " warn" : ""); }
}

async function initDb() {
  // Resolved ONCE, outside render. `use()` returns null when the view cannot run
  // the capability — not served, not granted, or failed to load.
  let db = null;
  try { db = await claude.use("db"); } catch (e) { db = null; }
  if (!db) {
    setStatus("Saved in this browser only — not synced. Copy the JSON when you finish.", true);
    return;
  }
  DB = db;
  setStatus("Saved to this artifact — your labels survive a browser change.", false);
  // Subscribe ONCE, never in render.
  try {
    db.collection("labels").onSnapshot(snap => {
      let touched = false;
      (snap.docs || snap || []).forEach(d => {
        const v = d.data ? d.data() : d;
        if (!v || v.n == null) return;
        const mine = labels[v.n];
        // Last-writer-wins, and a remote row only fills a gap or arrives newer.
        if (!mine || (v.at && (!mine.at || v.at > mine.at))) {
          labels[v.n] = {level: v.level || null, span: v.span || "",
                         worklang: v.worklang || "", auth: v.auth || "",
                         note: v.note || "", at: v.at};
          touched = true;
        }
      });
      if (touched) { saveLocal(); synced = true; renderList(); }
    }, () => setStatus("Sync interrupted — still saved in this browser.", true));
  } catch (e) {
    setStatus("Saved in this browser only — not synced.", true);
  }
}
// Actually escapes. The first version was a no-op String() while its output went
// straight into innerHTML — latent on this data (0 of 98 blocks contain < > &)
// but a regenerate on other ads would mangle the text being judged.
const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");
const rec = n => (labels[n] = labels[n] || {level:null, span:"", worklang:"", auth:"", note:""});
const done = n => !!(labels[n] && labels[n].level);

function renderList(){
  const ol = document.getElementById("list");
  ol.innerHTML = "";
  DATA.ads.forEach((a, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.setAttribute("aria-current", i === cur ? "true" : "false");
    b.innerHTML = `<span class="dot ${done(a.n) ? "done" : ""}"></span>
      <span class="nm">${a.n}</span><span class="st">${esc(a.stratum)}</span>`;
    b.onclick = () => { cur = i; render(); };
    li.appendChild(b); ol.appendChild(li);
  });
  const n = DATA.ads.filter(a => done(a.n)).length;
  document.getElementById("ptext").textContent = `${n} / ${DATA.ads.length}`;
  document.getElementById("pbar").style.width = (100 * n / DATA.ads.length) + "%";
}

function render(){
  const a = DATA.ads[cur], r = rec(a.n);
  const m = document.getElementById("main");
  m.innerHTML = `
    <div class="card">
      <span class="strat">${esc(a.stratum)}</span>
      <div class="adtitle">${esc(a.title)}</div>
      <p class="why">Why this ad is in the set — ${esc(DATA.why[a.stratum] || "")}</p>
      <div class="meta">
        <span><b>${esc(a.nav || "?")}</b> occupation</span>
        <span>role_family <b>${esc(a.family || "?")}</b></span>
        <span>title <b>${esc(a.std || "?")}</b></span>
        <span>doc_lang <b>${esc(a.doc_lang)}</b></span>
        <span>${a.n_chars} chars ${a.truncated
          ? '<span class="trunc">· TRUNCATED — ' + esc(a.truncated_note || "") + '</span>' : ""}</span>
      </div>
    </div>

    ${a.prefill && a.prefill.norwegian_requirement_level ? `
      <div class="pf"><b>Opus suggestion — unconfirmed, not gold.</b>
        level <code>${esc(a.prefill.norwegian_requirement_level)}</code>,
        working language <code>${esc(a.prefill.stated_working_language)}</code>.
        <div style="margin-top:5px">${esc(a.prefill.reasoning)}</div>
        <button class="act" style="margin-top:8px" id="takepf">Accept as my label</button>
      </div>` : ""}

    <div class="card">
      <h3>The advertisement's language lines</h3>
      <p class="hintline">Highlighted lines carry a language word; the line above each is
        shown because whether a quote starts at a boundary depends on its neighbour.
        <strong>Click a line to set it as the evidence span</strong> — that guarantees the
        character-exact copy the validator requires. Grey text is a <strong>literal</strong>
        English gloss: <code>må</code>=must, <code>bør</code>=should,
        <code>ønskelig</code>/<code>er en fordel</code>=desirable,
        <code>ikke et krav</code>=not a requirement,
        <code>eller</code>=<strong>or</strong>, <code>og</code>=<strong>and</strong>.
        The span you record is always the Norwegian original.</p>
      <div id="blocks"></div>
    </div>

    <div class="card">
      <h3>Your label</h3>
      <div class="levels" id="levels"></div>

      <label class="f" for="span">evidence_span — must be verbatim, a complete sentence or bullet</label>
      <textarea id="span" spellcheck="false">${esc(r.span)}</textarea>
      <div class="spanok" id="spanok"></div>

      <label class="f" for="wl">stated_working_language</label>
      <select id="wl"><option value=""${r.worklang ? "" : " selected"}>— not set —</option>${DATA.worklang.map(w =>
        `<option value="${w}"${r.worklang === w ? " selected" : ""}>${w}</option>`).join("")}</select>

      <label class="f" for="auth">authorisation_required — a licence to practise, not a language rule</label>
      <input id="auth" spellcheck="false" placeholder="copy the ad's own wording, or leave blank"
             value="${esc(r.auth).replace(/"/g, "&quot;")}">
      <div class="spanok" id="authok"></div>
      ${(a.auth_lines || []).length ? `<div class="authsug">The ad says — click to use:
        ${a.auth_lines.map(l => `<button type="button" class="authbtn">${esc(l)}</button>`).join("")}
        </div>` : ""}

      <label class="f" for="note">note — anything a reader would need to follow your reasoning</label>
      <textarea id="note">${esc(r.note)}</textarea>

      <div class="navbtns">
        <button class="act" id="prev">← previous</button>
        <button class="act primary" id="next">next ad →</button>
        <button class="act" id="exp" style="margin-left:auto">Show JSON to copy</button>
      </div>
      <p class="kbd-help"><kbd>1</kbd>–<kbd>9</kbd> pick a level ·
        <kbd>j</kbd>/<kbd>k</kbd> next / previous ad</p>
    </div>

    <div class="card" id="expcard" hidden>
      <h3>Paste this back into the repo</h3>
      <p class="hintline">Save as <code>data/worksheet/sealed_labels.json</code>. Downloads are
        blocked inside the artifact viewer, so copy from here.</p>
      <textarea id="out" spellcheck="false"></textarea>
      <div class="navbtns"><button class="act" id="copy">Copy to clipboard</button></div>
    </div>`;

  const bl = document.getElementById("blocks");
  a.blocks.forEach(b => {
    const el = document.createElement("button");
    el.className = "blk" + (b.hit ? " hit" : "") + (b.ok ? "" : " bad")
                 + (r.span === b.text ? " chosen" : "");
    el.innerHTML = esc(b.text)
      + (b.en ? `<span class="gloss">${esc(b.en)}</span>` : "")
      + (b.ok ? (b.hit ? "<small>carries a language word · valid as evidence</small>" : "")
              : `<small class="no">not usable as evidence — ${esc(b.why)}</small>`);
    el.onclick = () => { r.span = b.text; save(a.n); render(); };
    bl.appendChild(el);
  });

  const lv = document.getElementById("levels");
  DATA.levels.forEach((L, i) => {
    const el = document.createElement("button");
    el.className = "lv"; el.type = "button";
    el.setAttribute("aria-pressed", r.level === L ? "true" : "false");
    el.innerHTML = `<kbd>${i + 1}</kbd><span>${L}<em>${esc(DATA.hint[L] || "")}</em></span>`;
    el.onclick = () => { r.level = L; save(a.n); renderList(); render(); };
    lv.appendChild(el);
  });

  const checkSpan = () => {
    const raw = document.getElementById("span").value;
    const s = raw.trim();
    const ok = document.getElementById("spanok");
    if (!s) { ok.className = "spanok"; ok.textContent =
      "empty — correct if the ad states nothing about language"; return; }
    // The verdict comes from census_validate itself, computed per block at build
    // time. A JS reimplementation drifted badly in the first version: it showed a
    // green tick for all 98 blocks while the real validator accepted 42, and
    // painted a warning on mid-block spans it actually accepts.
    // Look up the precomputed verdict. Covers whole lines AND Opus's suggestion,
    // which is often a sentence INSIDE a line — valid, but the first version
    // recognised only whole-line matches and warned on it.
    const vd = (a.verdicts || {})[s];
    if (vd) {
      ok.className = "spanok " + (vd.ok ? "y" : "n");
      ok.textContent = vd.ok
        ? "✓ the validator accepts this span"
        : "✗ the validator REJECTS this span — " + vd.why +
          (exact.why === "no_language_token"
            ? " (it names no language, so it can never be matched — pick the line that does)"
            : exact.why === "fragment_too_short" ? " (under 15 characters)" : "");
      return;
    }
    ok.className = "spanok n";
    ok.textContent = "⚠ not one of the lines above — cannot be verified here. "
      + "Click a line instead; a hand-typed span that differs by one character fails.";
  };  document.getElementById("wl").onchange = e => { r.worklang = e.target.value; save(a.n); };
  // The value is SCORED against the extractor's Norwegian, so a paraphrase
  // fails a correct answer. Warn the moment it is not in the ad.
  const checkAuth = () => {
    const el = document.getElementById("authok");
    const val = (document.getElementById("auth").value || "").trim();
    if (!val) { el.className = "spanok"; el.textContent = ""; return; }
    const inAd = (a.auth_lines || []).some(l =>
      l.toLowerCase().includes(val.toLowerCase()));
    el.className = "spanok " + (inAd ? "y" : "n");
    el.textContent = inAd
      ? "✓ written this way in the ad"
      : "⚠ not the ad's wording — this field is scored against the model's "
        + "Norwegian, so a translation or paraphrase fails a correct answer";
  };
  document.getElementById("auth").oninput = e => {
    r.auth = e.target.value; save(a.n); checkAuth();
  };
  checkAuth();
  document.querySelectorAll(".authbtn").forEach(b => {
    b.onclick = () => { r.auth = b.textContent; save(a.n); render(); };
  });
  document.getElementById("note").oninput = e => { r.note = e.target.value; save(a.n); };
  document.getElementById("prev").onclick = () => go(-1);
  document.getElementById("next").onclick = () => go(1);
  const pf = document.getElementById("takepf");
  if (pf) pf.onclick = () => {
    r.level = a.prefill.norwegian_requirement_level;
    r.worklang = a.prefill.stated_working_language || "";
    r.span = a.prefill.evidence_span || "";
    // NOT the model's authorisation string: it is often an English rendering,
    // and the field is scored against Norwegian. Prefer the ad's own line.
    r.auth = (a.auth_lines && a.auth_lines.length === 1) ? a.auth_lines[0] : "";
    save(a.n); renderList(); render();
  };
  document.getElementById("exp").onclick = () => {
    const c = document.getElementById("expcard");
    c.hidden = false;
    // Shape matches eval/golden_set.json's CLOSED key vocabulary
    // (tests/unit/test_scoring.py GOLDEN_KEYS). The first version emitted
    // nav_category/labelled_by/confirmed — none of which are permitted — and
    // omitted derived_accessible, which two tests require on every row. It also
    // emitted unlabelled rows, which would crash scoring on a null level.
    const rows = DATA.ads.filter(x => (labels[x.n] || {}).level).map(x => {
      const L = labels[x.n];
      return {
        n: x.n, uuid: x.uuid, title: x.title, stratum: x.stratum,
        expected: {
          norwegian_requirement_level: L.level,
          evidence_span: (L.span || "").trim() || null,
          stated_working_language: L.worklang || "unstated",
          authorisation_required: (L.auth || "").trim() || null
        },
        note: (L.note || "").trim() || null,
        doc_lang: x.doc_lang,
        derived_accessible: null   // recomputed on ingest by derive_english_accessible
      };
    });
    document.getElementById("out").value = JSON.stringify(rows, null, 1);
    const left = DATA.ads.length - rows.length;
    document.querySelector("#expcard .hintline").innerHTML = left
      ? `<strong>${rows.length} of ${DATA.ads.length} exported.</strong> ${left} still
         unlabelled and deliberately omitted — an unlabelled row would crash scoring.
         Save as <code>data/worksheet/sealed_labels.json</code>.`
      : `All ${rows.length} exported. Save as
         <code>data/worksheet/sealed_labels.json</code>. Downloads are blocked in the
         artifact viewer, so copy from here.`;
    c.scrollIntoView({behavior: "smooth"});
    document.getElementById("copy").onclick = async () => {
      const btn = document.getElementById("copy");
      try { await navigator.clipboard.writeText(document.getElementById("out").value);
            btn.textContent = "Copied"; }
      catch (e) { btn.textContent = "Clipboard blocked — select the text and copy manually"; }
    };
  };
  renderList();
  window.scrollTo({top: 0});
}

function go(d){ cur = Math.max(0, Math.min(DATA.ads.length - 1, cur + d)); render(); }
document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  // Without this, Cmd/Ctrl+1..9 (browser tab switching) silently overwrote the
  // current ad's level.
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "j") go(1);
  if (e.key === "k") go(-1);
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= DATA.levels.length) {
    const ad = DATA.ads[cur]; rec(ad.n).level = DATA.levels[n - 1];
    save(ad.n); renderList(); render();
  }
});
render();
initDb();
</script>
