[project]
name = "finn-smart-search"
version = "0.1.0"
description = "Constraint-aware job search over the Norwegian NAV job-ad feed"
requires-python = ">=3.11"
dependencies = [
  "httpx[http2]>=0.27", "tenacity>=8.2", "duckdb>=1.0", "pyarrow>=15",
  "selectolax>=0.3", "lingua-language-detector>=2.0", "regex>=2024.0",
  "pydantic>=2.6", "typer>=0.12", "rich>=13", "pyyaml>=6",
  "numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4",
]

[project.optional-dependencies]
llm    = ["anthropic>=0.40"]
search = ["bm25s>=0.2", "PyStemmer>=2.2", "sentence-transformers>=3.0", "pyahocorasick>=2.1"]
dev    = ["pytest>=8", "pytest-recording>=0.13", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finn_smart_search"]

[tool.ruff]
line-length = 100
